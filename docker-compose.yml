# Docker Compose configuration for QuantumSafe-XCryptor
#
# Post-Quantum Hybrid Encryption System
# Demonstrates Kyber1024 + AES-256-GCM across .NET and Python
#
# Roles:
# - .NET service: Generates Kyber1024 keypair, performs hybrid encryption and decryption
# - Python service: Performs hybrid decryption to validate cross-language PQ compatibility
#
# Both services mount the same host directory ./shared to /data to exchange:
# - kyber_public.key / kyber_private.key (Kyber1024 keypairs)
# - kyber_ciphertext.bin (encapsulated shared secret)
# - sample.txt (plaintext input)
# - encrypted.bin (hybrid encrypted output)
# - decrypted*.txt (verification outputs)

services:
  # .NET service (Kyber1024 key generation + hybrid encryption + decryption)
  dotnet-service:
    build: ./dotnet-service # Build using Dockerfile in ./dotnet-service
    container_name: quantumsafe-dotnet
    volumes:
      - ./shared:/data # Shared data volume for keys and IO files

  # Python service (hybrid decryption using Kyber1024)
  python-service:
    build: ./python-service # Build using Dockerfile in ./python-service
    container_name: quantumsafe-python
    volumes:
      - ./shared:/data # Mount the same shared data volume
    depends_on:
      - dotnet-service # Ensure .NET runs first to generate Kyber keys and encrypt
