# Docker Compose configuration for QuantumSafe-XCryptor
#
# Post-Quantum Hybrid Encryption System (3-Service Architecture)
# Demonstrates ML-KEM-1024 + AES-256-GCM workflow
#
# Flow:
# 1. python-keygen:   Generate ML-KEM-1024 keypair (public/private keys)
# 2. dotnet-encrypt:  Load public key, encapsulate, encrypt file
# 3. python-decrypt:  Load private key, decapsulate, decrypt file
#
# Shared volume ./shared mounted as /data for key/file exchange:
# - kyber_public.key / kyber_private.key (ML-KEM-1024 keypairs)
# - kyber_ciphertext.bin (encapsulated shared secret)
# - encrypted-dotnet.bin (hybrid encrypted packet)
# - decrypted-python.txt (verification output)

services:
  # Service 1: Python key generation
  python-keygen:
    build: ./python-keygen
    volumes:
      - ./shared:/data

  # Service 2: .NET encapsulation + encryption
  dotnet-encrypt:
    build: ./dotnet-encrypt
    volumes:
      - ./shared:/data
    depends_on:
      python-keygen:
        condition: service_completed_successfully

  # Service 3: Python decapsulation + decryption
  python-decrypt:
    build: ./python-decrypt
    volumes:
      - ./shared:/data
    depends_on:
      dotnet-encrypt:
        condition: service_completed_successfully
